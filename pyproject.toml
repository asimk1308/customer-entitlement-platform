# Python only for the MCP server and the tools that need it. The platform itself is Java: see pom.xml.
[project]
name = "support-copilot-mcp"
version = "0.1.0"
description = "The MCP server over the Customer Entitlement & Support Case API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    # Pinned: 2.x renamed FastMCP to MCPServer, so unpinned upgrades can break the import.
    "mcp==2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "schemathesis>=4.33,<5",
    "openapi-spec-validator>=0.7",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# mcp/ itself is deliberately not on the path: it would shadow the `mcp` SDK.
pythonpath = ["mcp", "tests/guardrails"]

[tool.ruff]
line-length = 100
src = ["mcp", "tests"]
