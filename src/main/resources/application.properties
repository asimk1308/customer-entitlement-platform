spring.main.banner-mode=off
spring.threads.virtual.enabled=true
logging.structured.format.console=logstash
logging.level.root=WARN
logging.level.com.example.platform=INFO

# Timeouts live here because they are what an operator tunes in an incident.
platform.db-path=${PLATFORM_DB_PATH:var/platform.db}
platform.upstream-url=${UPSTREAM_URL:http://localhost:9001}
platform.idp-url=${IDP_URL:http://localhost:9100}
platform.issuer=${IDP_ISSUER:http://localhost:9100}
platform.audience=platform-api
# Dev default so that `make run` needs no setup. Real deployments set this from a secret store.
platform.cursor-secret=${CURSOR_SECRET:dev-only-cursor-secret}
platform.entitlement-ttl=60s
platform.rate-limit-per-minute=${RATE_LIMIT_PER_MINUTE:600}
platform.webhook-allowed-hosts=${WEBHOOK_ALLOWED_HOSTS:localhost:9002}
# 0 disables the background worker; tests then run delivery cycles themselves.
platform.outbox-poll=500ms

platform.cases.attempt-timeout=800ms
platform.cases.max-attempts=3
platform.cases.deadline=2s
platform.entitlements.attempt-timeout=500ms
platform.entitlements.max-attempts=3
platform.entitlements.deadline=1200ms
# Usage is optional, so it gets the tightest budget: it must never hold up the response for long.
# Its deadline sits below the customer endpoint's 800 ms p99 target in PLATFORM.md.
platform.usage.attempt-timeout=250ms
platform.usage.max-attempts=2
platform.usage.deadline=500ms

# Nothing here accepts multipart, and parsing it on a malformed request would be a 500.
spring.servlet.multipart.enabled=false
# Static resources are off, and so an unknown path reaches the 404 handler.
spring.web.resources.add-mappings=false
# Refusing these at the socket would return a non-JSON 400, so they go through to validation instead.
server.tomcat.relaxed-path-chars=|,{,},[,],^,`,\\,<,>,"
server.tomcat.relaxed-query-chars=|,{,},[,],^,`,\\,<,>,"
